<h2 mat-dialog-title data-cy="oauthMockRoleDialogTitle">Business Partner Created</h2>
<mat-dialog-content>
  <p data-cy="oauthMockRoleDialogDescription">
    Add the following value to the oauth-mock business partner roles before continuing:
  </p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Role value</mat-label>
    <input matInput [value]="data.roleValue" readonly data-cy="oauthMockRoleValue" />
  </mat-form-field>
  <app-clipboard [value]="data.roleValue" [label]="'Copy role value'" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()" obButton="primary" data-cy="oauthMockRoleDialogContinue">
    Continue
  </button>
</mat-dialog-actions>
